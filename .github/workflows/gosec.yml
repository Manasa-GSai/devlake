name: gosec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-*]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'backend/.gosec-baseline.json'
      - 'backend/scripts/gosec-lint.sh'
      - '.github/workflows/gosec.yml'

jobs:
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Run gosec ratchet
        shell: bash
        # gosec analyses source statically (no libgit2/CGO needed), but all
        # packages must load, so generate the gitignored mocks first.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          go install github.com/vektra/mockery/v2@v2.53.6
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd backend
          make mock
          go mod download
          scripts/gosec-lint.sh

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: backend/gosec.json
          if-no-files-found: warn
