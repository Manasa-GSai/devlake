name: arch-lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-*]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'backend/.go-arch-lint.yml'
      - 'backend/.architecture-baseline.json'
      - 'backend/scripts/arch-lint.sh'
      - '.github/workflows/arch-lint.yml'

jobs:
  arch-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Run architectural layer ratchet
        shell: bash
        # go-arch-lint analyses imports statically (no libgit2/CGO needed), but
        # all packages must load, so generate the gitignored mocks first.
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.15.0
          go install github.com/vektra/mockery/v2@v2.53.6
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd backend
          make mock
          go mod download
          scripts/arch-lint.sh
