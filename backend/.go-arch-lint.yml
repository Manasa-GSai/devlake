# Architectural layer model for the DevLake backend (go-arch-lint).
# Layering: Edge -> Application -> Execution -> Data. A layer may import
# itself, the layers below it, and shared utilities. Upward imports
# (e.g. Data -> Execution) are violations. See scripts/arch-lint.sh for the
# ratchet gate and .architecture-baseline.json for the recorded baseline.

version: 3
workdir: .
allow:
  depOnAnyVendor: true
components:
  edge:        { in: server/api/** }
  application: { in: server/services/** }
  execution:   { in: [ core/runner/**, core/plugin/**, plugins/** ] }
  data:        { in: [ core/dal/**, impls/**, core/models/** ] }
  shared:      { in: [ core/config/**, core/context/**, core/log/**, core/errors/**, core/migration/**, core/utils/**, core/version/**, helpers/** ] }
deps:
  edge:        { mayDependOn: [ edge, application, execution, data, shared ] }
  application: { mayDependOn: [ application, execution, data, shared ] }
  execution:   { mayDependOn: [ execution, data, shared ] }
  data:        { mayDependOn: [ data, shared ] }
  shared:      { mayDependOn: [ shared ] }
